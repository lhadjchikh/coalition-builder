name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
      - development
    paths:
      - "frontend/**"
      - ".github/workflows/deploy_frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - prod

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-frontend-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || (github.event_name == 'pull_request' && github.event.pull_request.number) || 'development' }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="prod"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ENV="preview"
          else
            ENV="development"
          fi

          echo "environment=${ENV}" >> "${GITHUB_OUTPUT}"
          echo "Deploying to: ${ENV}"

      - name: Set API URL
        id: api
        env:
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
        run: |
          ENV="${{ steps.env.outputs.environment }}"

          # Get API URL based on environment
          if [[ "${ENV}" == "prod" ]]; then
            API_URL="${{ vars.PRODUCTION_API_URL }}"
            SITE_URL="${{ vars.PRODUCTION_SITE_URL }}"
          else
            API_URL="${{ vars.DEVELOPMENT_API_URL }}"
            SITE_URL="${{ vars.DEVELOPMENT_SITE_URL || vars.PRODUCTION_SITE_URL }}"
          fi

          if [[ -z "${API_URL}" || -z "${SITE_URL}" || -z "${CLOUDFRONT_DOMAIN}" ]]; then
            echo "::error::API URL, site URL, and CLOUDFRONT_DOMAIN are required for frontend builds"
            exit 1
          fi

          {
            echo "api_url=${API_URL}"
            echo "site_url=${SITE_URL}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Map to Vercel environment
        id: vercel_env
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          if [[ "${ENV}" == "prod" ]]; then
            echo "vercel_env=production" >> "${GITHUB_OUTPUT}"
          else
            echo "vercel_env=preview" >> "${GITHUB_OUTPUT}"
          fi

      - name: Pull Vercel Environment Information
        env:
          VERCEL_ENVIRONMENT: ${{ steps.vercel_env.outputs.vercel_env }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment="${VERCEL_ENVIRONMENT}" --token="${VERCEL_TOKEN}"
        working-directory: ./frontend

      - name: Build Project Artifacts
        run: |
          if [[ "${{ steps.env.outputs.environment }}" == "prod" ]]; then
            vercel build --prod --token="${VERCEL_TOKEN}"
          else
            vercel build --token="${VERCEL_TOKEN}"
          fi
        working-directory: ./frontend
        env:
          API_URL: ${{ steps.api.outputs.api_url }}
          NEXT_PUBLIC_API_URL: ${{ steps.api.outputs.api_url }}
          NEXT_PUBLIC_ENVIRONMENT: ${{ steps.env.outputs.environment }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.api.outputs.site_url }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
          AWS_STORAGE_BUCKET_NAME: ${{ vars.AWS_STORAGE_BUCKET_NAME }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [[ "${{ steps.env.outputs.environment }}" == "prod" ]]; then
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --archive=tgz --token="${VERCEL_TOKEN}")
          else
            DEPLOY_URL=$(vercel deploy --prebuilt --archive=tgz --token="${VERCEL_TOKEN}")
          fi

          echo "url=${DEPLOY_URL}" >> "${GITHUB_OUTPUT}"
          echo "Deployed to: ${DEPLOY_URL}"
        working-directory: ./frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Create deployment summary
        run: |
          {
            echo "### 🚀 Frontend Deployment Complete!"
            echo ""
            echo "**Environment:** ${{ steps.env.outputs.environment }}"
            echo "**URL:** ${{ steps.deploy.outputs.url }}"
            echo "**API URL:** ${{ steps.api.outputs.api_url }}"
            echo ""
            echo "### 📊 Deployment Details"
            echo "- **Branch:** ${{ github.ref_name }}"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Triggered by:** ${{ github.actor }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const environment = '${{ steps.env.outputs.environment }}';

            const body = `## 🚀 Vercel Preview Deployment

            **Preview URL:** ${url}
            **Environment:** ${environment}
            **API URL:** ${{ steps.api.outputs.api_url }}

            ### Lighthouse Scores
            Run Lighthouse CI to check performance scores.

            ### Next Steps
            - Test the preview deployment
            - Check responsive design
            - Verify API integration
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Run smoke tests
        if: steps.env.outputs.environment != 'prod'
        continue-on-error: true
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"

          echo "Running smoke tests on $DEPLOY_URL"

          # Test homepage
          curl -f -s -o /dev/null -w "Homepage: %{http_code}\n" "$DEPLOY_URL/"

          # Test campaigns page
          curl -f -s -o /dev/null -w "Campaigns: %{http_code}\n" "$DEPLOY_URL/campaigns"

          # Test health endpoint
          curl -f -s -o /dev/null -w "Health: %{http_code}\n" "$DEPLOY_URL/api/health"

      - name: Alias production deployment
        if: steps.env.outputs.environment == 'prod' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel alias set "${DEPLOY_URL}" "${PRODUCTION_DOMAIN}" --token="${VERCEL_TOKEN}"
        working-directory: ./frontend
