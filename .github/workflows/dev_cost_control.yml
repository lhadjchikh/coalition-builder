name: Dev Cost Control

on:
  workflow_dispatch:
    inputs:
      vpc_endpoints:
        description: "VPC endpoints (disable to save at least ~$14.88/mo)"
        required: true
        type: choice
        options:
          - enable
          - disable
      ses_endpoint:
        description: "SES API endpoint (adds ~$7.44/mo while enabled)"
        required: true
        default: disable
        type: choice
        options:
          - disable
          - enable

permissions:
  contents: read
  id-token: write

jobs:
  toggle-resources:
    name: "${{ github.event.inputs.vpc_endpoints == 'enable' && 'Enable' || 'Disable' }} VPC Endpoints"
    runs-on: ubuntu-latest
    environment: dev

    env:
      TF_DIRECTORY: terraform/environments/dev
      TF_VAR_app_db_username: ${{ secrets.APP_DB_USERNAME }}
      TF_VAR_app_db_password: ${{ secrets.APP_DB_PASSWORD }}
      TF_VAR_site_password: ${{ secrets.SITE_PASSWORD }}
      TF_VAR_shared_peering_role_arn: ${{ secrets.SHARED_PEERING_ROLE_ARN }}
      TF_VAR_shared_account_id: ${{ vars.SHARED_ACCOUNT_ID }}
      TF_VAR_github_repo: ${{ vars.REPO_FULL_NAME }}
      TF_VAR_alert_email: ${{ vars.TF_VAR_ALERT_EMAIL }}
      TF_VAR_enable_vpc_endpoints: ${{ github.event.inputs.vpc_endpoints == 'enable' && 'true' || 'false' }}
      TF_VAR_enable_ses_endpoint: ${{ github.event.inputs.vpc_endpoints == 'enable' && github.event.inputs.ses_endpoint == 'enable' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS Account ID
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::AWS_ACCOUNT_ID variable is not set in the 'dev' GitHub environment"
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-dev
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.12.1

      - name: Setup Remote State
        run: |
          cd "$TF_DIRECTORY"
          chmod +x ../../scripts/setup_remote_state.sh
          ../../scripts/setup_remote_state.sh dev

      - name: Terraform Init
        run: |
          cd "$TF_DIRECTORY"
          timeout 5m terraform init -backend-config=backend.hcl -input=false

      - name: Terraform Plan
        id: plan
        run: |
          cd "$TF_DIRECTORY"
          terraform plan -no-color -input=false -out=tfplan \
            -target='module.networking.aws_vpc_endpoint.interface' \
            -target='module.networking.aws_security_group.vpc_endpoints'

      - name: Terraform Apply
        run: |
          cd "$TF_DIRECTORY"
          terraform apply -input=false tfplan

      - name: Summary
        env:
          ACTION: ${{ github.event.inputs.vpc_endpoints }}
          SES_ENDPOINT: ${{ github.event.inputs.ses_endpoint }}
        run: |
          if [ "$ACTION" = "enable" ]; then
            echo "### VPC Endpoints Enabled" >> $GITHUB_STEP_SUMMARY
            echo "Dev VPC endpoints are now **active**. Lambda can reach AWS services via private networking." >> $GITHUB_STEP_SUMMARY
            if [ "$SES_ENDPOINT" = "enable" ]; then
              echo "The SES API endpoint is **temporarily enabled** for connectivity testing and adds ~\$7.44/mo while active." >> $GITHUB_STEP_SUMMARY
            else
              echo "The SES API endpoint is **disabled**." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### VPC Endpoints Disabled" >> $GITHUB_STEP_SUMMARY
            echo "Dev VPC endpoints are now **disabled**, saving ~\$15/mo with the default endpoint set." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **Note:** Lambda functions in the dev VPC will not be able to access Secrets Manager, Geo Places, or SES while endpoints are disabled (no internet egress and no VPC endpoints)." >> $GITHUB_STEP_SUMMARY
          fi
