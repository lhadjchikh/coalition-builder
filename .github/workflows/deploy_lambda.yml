name: Deploy to Lambda

on:
  push:
    branches:
      - main
      - development
    paths:
      - "backend/**"
      - ".github/workflows/deploy_lambda.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-lambda-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Django to Lambda
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve deployment environment
        id: deployment_environment
        run: |
          DEPLOYMENT_ENVIRONMENT="${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || 'dev' }}"
          echo "environment=${DEPLOYMENT_ENVIRONMENT}" >> "${GITHUB_OUTPUT}"

      - name: Validate required configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_LOCATION_PLACE_INDEX_NAME: ${{ vars.AWS_LOCATION_PLACE_INDEX_NAME }}
          AWS_STORAGE_BUCKET_NAME: ${{ vars.AWS_STORAGE_BUCKET_NAME }}
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
          DATABASE_SECRET_ARN: ${{ secrets.DATABASE_SECRET_ARN }}
          DEFAULT_FROM_EMAIL: ${{ vars.DEFAULT_FROM_EMAIL }}
          DEPLOYMENT_API_URL: ${{ steps.deployment_environment.outputs.environment == 'prod' && vars.PRODUCTION_API_URL || vars.DEVELOPMENT_API_URL }}
          DJANGO_SECRET_ARN: ${{ secrets.DJANGO_SECRET_ARN }}
          SITE_URL: ${{ vars.SITE_URL }}
          VPC_SECURITY_GROUP_IDS: ${{ vars.VPC_SECURITY_GROUP_IDS }}
          VPC_SUBNET_IDS: ${{ vars.VPC_SUBNET_IDS }}
          ZAPPA_ROLE_NAME: ${{ vars.ZAPPA_ROLE_NAME }}
          ZAPPA_S3_BUCKET: ${{ vars.ZAPPA_S3_BUCKET }}
        run: |
          required_names=(
            AWS_ACCOUNT_ID
            AWS_LOCATION_PLACE_INDEX_NAME
            AWS_STORAGE_BUCKET_NAME
            DATABASE_SECRET_ARN
            DEPLOYMENT_API_URL
            DJANGO_SECRET_ARN
            VPC_SECURITY_GROUP_IDS
            VPC_SUBNET_IDS
            ZAPPA_ROLE_NAME
            ZAPPA_S3_BUCKET
          )

          if [[ "${{ steps.deployment_environment.outputs.environment }}" == "prod" ]]; then
            # Without these, prod still sends mail — but from an address SES
            # rejects, carrying verification links to http://localhost:3000.
            required_names+=(CLOUDFRONT_DOMAIN SITE_URL DEFAULT_FROM_EMAIL)
          fi

          for required_name in "${required_names[@]}"; do
            if [[ -z "${!required_name}" ]]; then
              echo "::error::${required_name} is not set in the selected GitHub environment"
              exit 1
            fi
          done

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-${{ steps.deployment_environment.outputs.environment }}
          aws-region: us-east-1

      - name: Verify Lambda execution role can read runtime secrets
        env:
          DATABASE_SECRET_ARN: ${{ secrets.DATABASE_SECRET_ARN }}
          DJANGO_SECRET_ARN: ${{ secrets.DJANGO_SECRET_ARN }}
          ZAPPA_ROLE_NAME: ${{ vars.ZAPPA_ROLE_NAME }}
        run: |
          ROLE_ARN=$(aws iam get-role --role-name "${ZAPPA_ROLE_NAME}" --query "Role.Arn" --output text)
          DENIED_COUNT=$(aws iam simulate-principal-policy \
            --policy-source-arn "${ROLE_ARN}" \
            --action-names secretsmanager:GetSecretValue \
            --resource-arns "${DATABASE_SECRET_ARN}" "${DJANGO_SECRET_ARN}" \
            --query "length(EvaluationResults[0].ResourceSpecificResults[?EvalResourceDecision!='allowed'])" \
            --output text)

          if [[ "${DENIED_COUNT}" != "0" ]]; then
            echo "::error::${ZAPPA_ROLE_NAME} cannot read one or more configured runtime secrets"
            exit 1
          fi

      - name: Verify Zappa deployment state
        id: zappa_deployment
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ steps.deployment_environment.outputs.environment }}
        run: |
          FUNCTION_NAME="coalition-${DEPLOYMENT_ENVIRONMENT}"
          STACK_NAME="coalition-${DEPLOYMENT_ENVIRONMENT}"

          set +e
          FUNCTION_OUTPUT=$(aws lambda get-function --function-name "${FUNCTION_NAME}" 2>&1)
          FUNCTION_STATUS=$?
          STACK_OUTPUT=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" 2>&1)
          STACK_STATUS=$?
          set -e

          if [[ ${FUNCTION_STATUS} -eq 0 && ${STACK_STATUS} -eq 0 ]]; then
            echo "mode=update" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ ${FUNCTION_STATUS} -ne 0 && "${FUNCTION_OUTPUT}" != *"ResourceNotFoundException"* ]]; then
            echo "::error::Unable to inspect Lambda function ${FUNCTION_NAME}: ${FUNCTION_OUTPUT}"
            exit "${FUNCTION_STATUS}"
          fi

          if [[ ${STACK_STATUS} -ne 0 && "${STACK_OUTPUT}" != *"does not exist"* ]]; then
            echo "::error::Unable to inspect CloudFormation stack ${STACK_NAME}: ${STACK_OUTPUT}"
            exit "${STACK_STATUS}"
          fi

          if [[ ${FUNCTION_STATUS} -ne 0 && ${STACK_STATUS} -ne 0 ]]; then
            echo "mode=create" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::error::Zappa deployment is inconsistent: Lambda function and CloudFormation stack must either both exist or both be absent"
          exit 1

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image coordinates
        id: image
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ steps.deployment_environment.outputs.environment }}
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
        run: |
          {
            echo "registry=${ECR_REGISTRY}"
            echo "repository=coalition-${DEPLOYMENT_ENVIRONMENT}"
            echo "tag=${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: ./backend
        run: poetry install --no-interaction --no-ansi --only main

      - name: Validate database secret isolation
        working-directory: ./backend
        env:
          DATABASE_NAME_MAP: ../terraform/modules/database-names/environment_database_names.json
          DATABASE_SECRET_ARN: ${{ secrets.DATABASE_SECRET_ARN }}
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_ENVIRONMENT: ${{ steps.deployment_environment.outputs.environment }}
        run: |
          EXPECTED_DATABASE_NAME="$(jq -er --arg environment "${EXPECTED_ENVIRONMENT}" '.[$environment]' "${DATABASE_NAME_MAP}")"
          poetry run python scripts/validate_database_secret.py \
            --secret-arn "${DATABASE_SECRET_ARN}" \
            --expected-account-id "${EXPECTED_ACCOUNT_ID}" \
            --expected-environment "${EXPECTED_ENVIRONMENT}" \
            --expected-database-name "${EXPECTED_DATABASE_NAME}"

      - name: Configure Zappa settings
        working-directory: ./backend
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_LOCATION_PLACE_INDEX_NAME: ${{ vars.AWS_LOCATION_PLACE_INDEX_NAME }}
          AWS_REGION: us-east-1
          ZAPPA_S3_BUCKET: ${{ vars.ZAPPA_S3_BUCKET }}
          DEPLOYMENT_ENVIRONMENT: ${{ steps.deployment_environment.outputs.environment }}
          AWS_STORAGE_BUCKET_NAME: ${{ vars.AWS_STORAGE_BUCKET_NAME }}
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
          USE_CUSTOM_DOCKER: true
          ECR_REGISTRY: ${{ steps.image.outputs.registry }}
          VPC_SUBNET_IDS: ${{ vars.VPC_SUBNET_IDS }}
          VPC_SECURITY_GROUP_IDS: ${{ vars.VPC_SECURITY_GROUP_IDS }}
          DATABASE_SECRET_ARN: ${{ secrets.DATABASE_SECRET_ARN }}
          DJANGO_SECRET_ARN: ${{ secrets.DJANGO_SECRET_ARN }}
          ZAPPA_ROLE_NAME: ${{ vars.ZAPPA_ROLE_NAME }}
          # Email delivery settings baked into the Lambda environment
          SITE_URL: ${{ vars.SITE_URL }}
          API_URL: ${{ steps.deployment_environment.outputs.environment == 'prod' && vars.PRODUCTION_API_URL || vars.DEVELOPMENT_API_URL }}
          DEFAULT_FROM_EMAIL: ${{ vars.DEFAULT_FROM_EMAIL }}
          ADMIN_NOTIFICATION_EMAILS: ${{ vars.ADMIN_NOTIFICATION_EMAILS }}
          SES_CONFIGURATION_SET: ${{ vars.SES_CONFIGURATION_SET }}
        run: |
          poetry run python scripts/configure_zappa.py
          poetry run zappa save-python-settings-file "${DEPLOYMENT_ENVIRONMENT}"

      - name: Check whether the geolambda base image exists
        id: geolambda
        run: |
          set +e
          DESCRIBE_OUTPUT=$(aws ecr describe-images \
            --repository-name geolambda \
            --image-ids imageTag=3.10.3 \
            --region us-east-1 2>&1)
          DESCRIBE_STATUS=$?
          set -e

          if [[ ${DESCRIBE_STATUS} -eq 0 ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${DESCRIBE_OUTPUT}" == *"ImageNotFoundException"* || "${DESCRIBE_OUTPUT}" == *"RepositoryNotFoundException"* ]]; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Unable to inspect the geolambda image: ${DESCRIBE_OUTPUT}"
            exit "${DESCRIBE_STATUS}"
          fi

      - name: Build and push geolambda base image
        if: steps.geolambda.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/docker/geolambda/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.registry }}/geolambda:3.10.3
            ${{ steps.image.outputs.registry }}/geolambda:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push application image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/docker/app/Dockerfile.lambda
          push: true
          provenance: false
          build-args: |
            ECR_REGISTRY=${{ steps.image.outputs.registry }}
          tags: |
            ${{ steps.image.outputs.registry }}/${{ steps.image.outputs.repository }}:${{ steps.deployment_environment.outputs.environment }}
            ${{ steps.image.outputs.registry }}/${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.registry }}/${{ steps.image.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy with Zappa
        working-directory: ./backend
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ steps.deployment_environment.outputs.environment }}
          DEPLOYMENT_MODE: ${{ steps.zappa_deployment.outputs.mode }}
          IMAGE_URI: ${{ steps.image.outputs.registry }}/${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
        run: |
          if [[ "${DEPLOYMENT_MODE}" == "create" ]]; then
            poetry run zappa deploy "${DEPLOYMENT_ENVIRONMENT}" --docker-image-uri "${IMAGE_URI}"
            exit 0
          fi

          aws lambda wait function-updated --function-name "coalition-${DEPLOYMENT_ENVIRONMENT}"

          set +e
          UPDATE_OUTPUT=$(poetry run zappa update "${DEPLOYMENT_ENVIRONMENT}" --docker-image-uri "${IMAGE_URI}" 2>&1)
          UPDATE_STATUS=$?
          set -e
          echo "${UPDATE_OUTPUT}"

          if [[ ${UPDATE_STATUS} -eq 0 ]]; then
            exit 0
          fi

          if [[ "${UPDATE_OUTPUT}" != *"ResourceConflict"* && "${UPDATE_OUTPUT}" != *"concurrent"* ]]; then
            exit "${UPDATE_STATUS}"
          fi

          echo "Retrying after a concurrent Lambda update conflict"
          aws lambda wait function-updated --function-name "coalition-${DEPLOYMENT_ENVIRONMENT}"
          poetry run zappa update "${DEPLOYMENT_ENVIRONMENT}" --docker-image-uri "${IMAGE_URI}"

      - name: Verify deployed address configuration
        env:
          AWS_LOCATION_PLACE_INDEX_NAME: ${{ vars.AWS_LOCATION_PLACE_INDEX_NAME }}
          DEPLOYMENT_ENVIRONMENT: ${{ steps.deployment_environment.outputs.environment }}
        run: |
          aws lambda wait function-updated --function-name "coalition-${DEPLOYMENT_ENVIRONMENT}"

          DEPLOYED_PLACE_INDEX_NAME=$(aws lambda get-function-configuration \
            --function-name "coalition-${DEPLOYMENT_ENVIRONMENT}" \
            --query 'Environment.Variables.AWS_LOCATION_PLACE_INDEX_NAME' \
            --output text)

          if [[ "${DEPLOYED_PLACE_INDEX_NAME}" != "${AWS_LOCATION_PLACE_INDEX_NAME}" ]]; then
            echo "::error::Deployed Lambda is missing the configured AWS Location place index"
            exit 1
          fi

      - name: Create cache table
        working-directory: ./backend
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ steps.deployment_environment.outputs.environment }}
        run: poetry run zappa manage "${DEPLOYMENT_ENVIRONMENT}" createcachetable

      - name: Run database migrations
        working-directory: ./backend
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ steps.deployment_environment.outputs.environment }}
        run: poetry run zappa manage "${DEPLOYMENT_ENVIRONMENT}" "migrate --noinput"

      - name: Collect static files
        working-directory: ./backend
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ steps.deployment_environment.outputs.environment }}
        run: poetry run zappa manage "${DEPLOYMENT_ENVIRONMENT}" "collectstatic --noinput"

      - name: Verify deployed API health
        env:
          DEPLOYMENT_API_URL: ${{ steps.deployment_environment.outputs.environment == 'prod' && vars.PRODUCTION_API_URL || vars.DEVELOPMENT_API_URL }}
        run: |
          curl --fail --show-error --silent \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 5 \
            --max-time 15 \
            "${DEPLOYMENT_API_URL%/}/api/health/"

      - name: Report deployment
        env:
          DEPLOYMENT_API_URL: ${{ steps.deployment_environment.outputs.environment == 'prod' && vars.PRODUCTION_API_URL || vars.DEVELOPMENT_API_URL }}
        run: |
          {
            echo "### Lambda deployment complete"
            echo ""
            echo "- Environment: ${{ steps.deployment_environment.outputs.environment }}"
            echo "- API URL: ${DEPLOYMENT_API_URL}"
            echo "- Image: ${{ steps.image.outputs.registry }}/${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}"
          } >> "${GITHUB_STEP_SUMMARY}"
