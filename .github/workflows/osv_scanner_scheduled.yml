name: OSV-Scanner Scheduled Scan

on:
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan_scheduled:
    name: Report all dependency vulnerabilities
    runs-on: ubuntu-latest
    env:
      SCAN_TARGETS: |-
        --lockfile=./backend/poetry.lock
        --lockfile=./frontend/package-lock.json
        --lockfile=./terraform/tests/go.mod
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=results.json
            ${{ env.SCAN_TARGETS }}

      - name: Validate scan results
        env:
          OSV_RESULTS_FILE: results.json
        run: .github/scripts/validate_osv_results.sh "${OSV_RESULTS_FILE}"

      - name: Report vulnerabilities
        uses: google/osv-scanner-action/osv-reporter-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=false

      - name: Upload scan artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: OSV Scanner SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          sarif_file: results.sarif
