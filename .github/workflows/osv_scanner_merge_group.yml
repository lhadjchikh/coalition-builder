name: OSV-Scanner Merge Group Scan

on:
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  scan_merge_group:
    name: Reject newly introduced dependency vulnerabilities
    uses: ./.github/workflows/osv_scanner_compare.yml
    with:
      base_sha: ${{ github.event.merge_group.base_sha }}
      head_sha: ${{ github.sha }}
