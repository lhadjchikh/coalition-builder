name: Lambda Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - tail-logs
          - rollback
          - undeploy
          - schedule
          - unschedule
          - invoke
          - certify
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - dev
          - prod
      rollback_steps:
        description: "Number of versions to rollback"
        required: false
        default: "1"
      function_payload:
        description: "JSON payload for invoke action"
        required: false
        default: "{}"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-lambda-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  manage:
    name: Lambda Management - ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_LOCATION_PLACE_INDEX_NAME: ${{ vars.AWS_LOCATION_PLACE_INDEX_NAME }}
          AWS_STORAGE_BUCKET_NAME: ${{ vars.AWS_STORAGE_BUCKET_NAME }}
          DATABASE_SECRET_ARN: ${{ secrets.DATABASE_SECRET_ARN }}
          DJANGO_SECRET_ARN: ${{ secrets.DJANGO_SECRET_ARN }}
          ZAPPA_ROLE_NAME: ${{ vars.ZAPPA_ROLE_NAME }}
          ZAPPA_S3_BUCKET: ${{ vars.ZAPPA_S3_BUCKET }}
        run: |
          required_names=(
            AWS_ACCOUNT_ID
            AWS_LOCATION_PLACE_INDEX_NAME
            AWS_STORAGE_BUCKET_NAME
            DATABASE_SECRET_ARN
            DJANGO_SECRET_ARN
            ZAPPA_ROLE_NAME
            ZAPPA_S3_BUCKET
          )

          for required_name in "${required_names[@]}"; do
            if [[ -z "${!required_name}" ]]; then
              echo "::error::${required_name} is not set in the selected GitHub environment"
              exit 1
            fi
          done

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-${{ github.event.inputs.environment }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: ./backend
        run: poetry install --no-interaction --no-ansi --only main

      - name: Validate database secret isolation
        if: >-
          github.event.inputs.action == 'schedule' ||
          github.event.inputs.action == 'invoke' ||
          github.event.inputs.action == 'certify'
        working-directory: ./backend
        env:
          DATABASE_NAME_MAP: ../terraform/modules/database-names/environment_database_names.json
          DATABASE_SECRET_ARN: ${{ secrets.DATABASE_SECRET_ARN }}
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          EXPECTED_DATABASE_NAME="$(jq -er --arg environment "${EXPECTED_ENVIRONMENT}" '.[$environment]' "${DATABASE_NAME_MAP}")"
          poetry run python scripts/validate_database_secret.py \
            --secret-arn "${DATABASE_SECRET_ARN}" \
            --expected-account-id "${EXPECTED_ACCOUNT_ID}" \
            --expected-environment "${EXPECTED_ENVIRONMENT}" \
            --expected-database-name "${EXPECTED_DATABASE_NAME}"

      - name: Configure Zappa settings
        working-directory: ./backend
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_LOCATION_PLACE_INDEX_NAME: ${{ vars.AWS_LOCATION_PLACE_INDEX_NAME }}
          AWS_REGION: us-east-1
          AWS_STORAGE_BUCKET_NAME: ${{ vars.AWS_STORAGE_BUCKET_NAME }}
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
          DATABASE_SECRET_ARN: ${{ secrets.DATABASE_SECRET_ARN }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          DJANGO_SECRET_ARN: ${{ secrets.DJANGO_SECRET_ARN }}
          USE_CUSTOM_DOCKER: true
          VPC_SECURITY_GROUP_IDS: ${{ vars.VPC_SECURITY_GROUP_IDS }}
          VPC_SUBNET_IDS: ${{ vars.VPC_SUBNET_IDS }}
          ZAPPA_ROLE_NAME: ${{ vars.ZAPPA_ROLE_NAME }}
          ZAPPA_S3_BUCKET: ${{ vars.ZAPPA_S3_BUCKET }}
        run: poetry run python scripts/configure_zappa.py

      - name: Tail logs
        if: github.event.inputs.action == 'tail-logs'
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          {
            echo "### Lambda logs for ${DEPLOYMENT_ENVIRONMENT}"
            echo '```'
            aws logs tail "/aws/lambda/coalition-${DEPLOYMENT_ENVIRONMENT}" \
              --since 1h \
              --format short
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Roll back deployment
        if: github.event.inputs.action == 'rollback'
        working-directory: ./backend
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          ROLLBACK_STEPS: ${{ github.event.inputs.rollback_steps }}
        run: |
          if [[ ! "${ROLLBACK_STEPS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::rollback_steps must be a positive integer"
            exit 1
          fi
          poetry run zappa rollback "${DEPLOYMENT_ENVIRONMENT}" -n "${ROLLBACK_STEPS}"
          echo "Rolled back ${ROLLBACK_STEPS} version(s) in ${DEPLOYMENT_ENVIRONMENT}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Undeploy Lambda
        if: github.event.inputs.action == 'undeploy'
        working-directory: ./backend
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: poetry run zappa undeploy "${DEPLOYMENT_ENVIRONMENT}" --yes

      - name: Schedule Lambda
        if: github.event.inputs.action == 'schedule'
        working-directory: ./backend
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: poetry run zappa schedule "${DEPLOYMENT_ENVIRONMENT}"

      - name: Unschedule Lambda
        if: github.event.inputs.action == 'unschedule'
        working-directory: ./backend
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: poetry run zappa unschedule "${DEPLOYMENT_ENVIRONMENT}"

      - name: Invoke Lambda function
        if: github.event.inputs.action == 'invoke'
        working-directory: ./backend
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          FUNCTION_PAYLOAD: ${{ github.event.inputs.function_payload }}
        run: |
          INVOCATION_OUTPUT=$(poetry run zappa invoke "${DEPLOYMENT_ENVIRONMENT}" --raw-response "${FUNCTION_PAYLOAD}")
          {
            echo "### Lambda invocation result"
            echo '```json'
            echo "${INVOCATION_OUTPUT}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Certify deployment
        if: github.event.inputs.action == 'certify'
        working-directory: ./backend
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: poetry run zappa certify "${DEPLOYMENT_ENVIRONMENT}" --yes

      - name: Get Lambda status
        if: always()
        continue-on-error: true
        working-directory: ./backend
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          echo "### Current status" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          poetry run zappa status "${DEPLOYMENT_ENVIRONMENT}" >> "${GITHUB_STEP_SUMMARY}" 2>&1 || echo "Status not available" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
