name: OSV-Scanner PR Scan

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan_pr:
    name: Reject newly introduced dependency vulnerabilities
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      scan-args: |-
        --lockfile=./backend/poetry.lock
        --lockfile=./frontend/package-lock.json
        --lockfile=./terraform/tests/go.mod
