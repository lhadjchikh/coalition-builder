version: "2"

run:
  go: "1.25"
  modules-download-mode: readonly
  tests: true

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true

linters:
  enable:
    - gocritic
    - gosec
    - lll
    - misspell
  disable:
    - exhaustive
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - godot
    - testpackage
  settings:
    gocritic:
      disabled-checks:
        - commentFormatting
        - whyNoLint
      enabled-tags:
        - diagnostic
        - performance
        - style
    gosec:
      excludes:
        - G204
        - G304
      severity: medium
      confidence: medium
    govet:
      enable:
        - shadow
      disable:
        - fieldalignment
    lll:
      line-length: 120
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        path: _test\.go
        text: (// |/\*)
      - linters:
          - unused
        path: test_helpers\.go
      - linters:
          - funlen
          - gocognit
          - gocyclo
        path: _test\.go
      - linters:
          - nestif
        path: _test\.go
      - path: (.+)\.go$
        text: Error return value of .* is not checked
      - path: (.+)\.go$
        text: should have a package comment
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default: warning

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - terraform-tests
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
